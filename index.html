<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise For You ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif, 'SolaimanLipi';
        }
        body {
            background: linear-gradient(135deg, #ffe6eb 0%, #ffc0cb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .slider-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 600px;
            background: #fff5f7;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 8px solid #ffffff;
        }
        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .slide {
            min-width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        /* Card Styles */
        .img-card {
            width: 100%;
            height: 75%;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border: 4px solid #fff;
        }
        .quote-box {
            background: #ffffffd0;
            padding: 10px 15px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 14px;
            color: #d63384;
            font-weight: bold;
        }
        .letter-box {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed #ffb6c1;
            color: #4a4a4a;
            font-size: 15px;
            line-height: 1.6;
        }
        /* Navigation Buttons */
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #ff4d6d;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .prev { left: 10px; }
        .next { right: 10px; }
        
        /* Dots Indicator */
        .dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
        }
        .dot.active {
            background: #ff4d6d;
            width: 12px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="slider-container">
    <button class="btn prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="btn next" onclick="moveSlide(1)">&#10095;</button>

    <div class="slides" id="slides">
        <!-- Slide 1: First Photo -->
        <div class="slide">
            <img src="https://via.placeholder.com/350x450" class="img-card" alt="Photo 1">
            <div class="quote-box">"You're my favorite person." ✨</div>
        </div>

        <!-- Slide 2: Message/Letter -->
        <div class="slide">
            <div class="letter-box">
                <h3>A little something for you ❤️</h3>
                <br>
                <p>মারুফা, যদি পারো আমাকে ক্ষমা করে দিও। অনেক চেষ্টা করেছি নিজের অনুভূতিগুলো বদলে ফেলতে, কিন্তু পারিনি। আমি আবারও নতুন করে তোমার প্রেমে পড়ে গেছি...</p>
                <br>
                <b>— Kawser</b>
            </div>
        </div>

        <!-- Slide 3: Second Photo -->
        <div class="slide">
            <img src="https://via.placeholder.com/350x450" class="img-card" alt="Photo 2">
            <div class="quote-box">I love you, Moon Fairy 🌙</div>
        </div>

        <!-- Slide 4: Interactive Heart/Pop Slide -->
        <div class="slide">
            <h2 style="color: #ff4d6d; margin-bottom: 20px;">Open the Heart 💖</h2>
            <button onclick="alert('I Love You! 🌸')" style="padding: 12px 25px; background: #ff4d6d; color: white; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,77,109,0.3);">
                Tap to Open! 💌
            </button>
        </div>
    </div>

    <!-- Page Indicator Dots -->
    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>
</div>

<script>
    let currentIndex = 0;
    const slides = document.getElementById('slides');
    const dots = document.querySelectorAll('.dot');
    const totalSlides = 4;

    function moveSlide(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= totalSlides) currentIndex = totalSlides - 1;
        
        slides.style.transform = `translateX(-${currentIndex * 100}%)`;
        
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
        });
    }
</script>

</body>
</html>
